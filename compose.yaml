services:
  database:
    image: lscr.io/linuxserver/mariadb:11.4.10
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - database-config:/config
      # The initdb.d directory is used to initialize the database with custom SQL scripts.
      # https://docs.linuxserver.io/images/docker-mariadb/#bootstrapping-a-new-instance
      - ./initdb.d:/config/initdb.d
    restart: unless-stopped

  myaac:
    image: ghcr.io/atlas-kit/myaac:latest
    environment:
      - MYAAC_USE_ENV=yes
      - DB_HOST=database
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "${MYAAC_PORT:-80}:80/tcp"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - myaac-config:/config
      - ./config.lua:/srv/config.lua:ro
      - ./data:/srv/data:ro
    restart: unless-stopped

  atlas:
    image: ghcr.io/atlas-kit/atlas:${ATLAS_BRANCH:-dev}
    environment:
      - MYSQL_HOST=database
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    user: "1000:1000"
    ports:
      - "${ATLAS_GAME_PORT:-7171}:7171/tcp"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./config.lua:/srv/config.lua:ro
      - ./data:/srv/data:ro
    restart: unless-stopped

volumes:
  database-config:
  myaac-config:
